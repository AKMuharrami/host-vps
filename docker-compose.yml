version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mumantijai_backend
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - MAX_CONCURRENT_JOBS=1
    volumes:
      - /tmp/mumantij:/tmp

  frontend:
    image: nginx:alpine
    container_name: mumantijai_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

networks:
  default:
    name: mumantijai_network
